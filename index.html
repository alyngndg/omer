<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>omerr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f2e3c5;
            --text-color: #ff4f00;
            --font-family: 'League Spartan', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            position: relative;
            text-align: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Screen 1 Animation */
        #screen-1 {
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: 1.1rem;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* Signature Footer */
        .signature {
            position: absolute;
            bottom: 24px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Game Layout */
        .game-header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .game-area {
            width: 100%;
            max-width: 500px;
            height: 60vh;
            border: 2px dashed var(--text-color);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        #player {
            position: absolute;
            font-size: 64px;
            width: 64px;
            height: 64px;
            line-height: 64px;
            text-align: center;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .item {
            position: absolute;
            font-size: 36px;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Floating Score Text (+2 / -5) */
        .floating-text {
            position: absolute;
            font-weight: 700;
            font-size: 1.6rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 20;
        }

        .floating-text.plus {
            color: #2e7d32;
        }

        .floating-text.minus {
            color: #d32f2f;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); }
        }

        /* End Screen */
        .end-text {
            font-size: 1.3rem;
            font-weight: 600;
            max-width: 320px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Ekran 1 -->
    <div id="screen-1" class="screen active">
        <h1>hiiiiii</h1>
        <button class="btn" onclick="nextScreen(2)">tikla</button>
        <div class="signature">-Aley</div>
    </div>

    <!-- Ekran 2 -->
    <div id="screen-2" class="screen">
        <h2>umarim yolculugun cok guzel gecer omercim</h2>
        <button class="btn" onclick="startGame()">tikla</button>
        <div class="signature">-Aley</div>
    </div>

    <!-- Ekran 3: Oyun -->
    <div id="screen-3" class="screen">
        <div class="game-title">sana oyun yaptm</div>
        <div class="game-header">
            <div>Süre: <span id="timer">60</span>s</div>
            <div>Puan: <span id="score">0</span></div>
        </div>
        <div class="game-area" id="gameArea">
            <div id="player">🏎️</div>
        </div>
        <div class="controls-hint">(arabayi parmaginla surukle puan topla)</div>
        <div class="signature">-Aley</div>
    </div>

    <!-- Ekran 4: Oyun Sonu -->
    <div id="screen-4" class="screen">
        <div class="end-text">skorunu bilmiyorum ama iyi bir seydir herhalde agliyormm</div>
        <div class="signature">-Aley</div>
    </div>

    <script>
        function nextScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenNum}`).classList.add('active');
        }

        let score = 0;
        let timeLeft = 60;
        let gameInterval = null;
        let timerInterval = null;
        let itemSpawnInterval = null;
        
        const gameArea = document.getElementById('gameArea');
        const player = document.getElementById('player');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');

        let playerX = 0;
        let playerY = 0;
        let items = [];
        const itemEmojis = ['🏁', '😭', '☠️'];

        function startGame() {
            nextScreen(3);
            
            score = 0;
            timeLeft = 60;
            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;

            const rect = gameArea.getBoundingClientRect();
            playerX = rect.width / 2;
            playerY = rect.height - 80;
            updatePlayerPosition();

            // Kontroller
            gameArea.addEventListener('touchmove', handleTouch, { passive: false });
            gameArea.addEventListener('mousemove', handleMouse);
            window.addEventListener('keydown', handleKeydown);

            // Timer
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Daha sık emoji üretimi (her 300 ms'de bir)
            itemSpawnInterval = setInterval(spawnItem, 300);

            // Oyun Döngüsü (Yüksek kare hızı ve akış)
            gameInterval = setInterval(updateGame, 16);
        }

        function updatePlayerPosition() {
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
        }

        function handleTouch(e) {
            e.preventDefault();
            const rect = gameArea.getBoundingClientRect();
            const touch = e.touches[0];
            playerX = Math.max(32, Math.min(rect.width - 32, touch.clientX - rect.left));
            playerY = Math.max(32, Math.min(rect.height - 32, touch.clientY - rect.top));
            updatePlayerPosition();
        }

        function handleMouse(e) {
            if (e.buttons === 1) {
                const rect = gameArea.getBoundingClientRect();
                playerX = Math.max(32, Math.min(rect.width - 32, e.clientX - rect.left));
                playerY = Math.max(32, Math.min(rect.height - 32, e.clientY - rect.top));
                updatePlayerPosition();
            }
        }

        function handleKeydown(e) {
            const speed = 25;
            const rect = gameArea.getBoundingClientRect();
            if (e.key === 'ArrowUp') playerY = Math.max(32, playerY - speed);
            if (e.key === 'ArrowDown') playerY = Math.min(rect.height - 32, playerY + speed);
            if (e.key === 'ArrowLeft') playerX = Math.max(32, playerX - speed);
            if (e.key === 'ArrowRight') playerX = Math.min(rect.width - 32, playerX + speed);
            updatePlayerPosition();
        }

        function spawnItem() {
            const rect = gameArea.getBoundingClientRect();
            const emoji = itemEmojis[Math.floor(Math.random() * itemEmojis.length)];
            
            const itemEl = document.createElement('div');
            itemEl.className = 'item';
            itemEl.textContent = emoji;

            const x = Math.random() * (rect.width - 60) + 30;
            const y = -30;
            // Düşme hızı belirgin şekilde artırıldı (5px - 9px arası)
            const speed = Math.random() * 4 + 5; 
            
            itemEl.style.left = x + 'px';
            itemEl.style.top = y + 'px';

            gameArea.appendChild(itemEl);
            items.push({ element: itemEl, x: x, y: y, speed: speed, emoji: emoji });
        }

        function showFloatingText(text, isPlus) {
            const floatEl = document.createElement('div');
            floatEl.className = `floating-text ${isPlus ? 'plus' : 'minus'}`;
            floatEl.textContent = text;
            floatEl.style.left = playerX + 'px';
            floatEl.style.top = (playerY - 20) + 'px';
            gameArea.appendChild(floatEl);

            setTimeout(() => {
                floatEl.remove();
            }, 800);
        }

        function updateGame() {
            const rect = gameArea.getBoundingClientRect();

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;
                item.element.style.top = item.y + 'px';

                if (item.y > rect.height + 40) {
                    item.element.remove();
                    items.splice(i, 1);
                    continue;
                }

                const dist = Math.hypot(playerX - item.x, playerY - item.y);
                if (dist < 48) {
                    if (item.emoji === '☠️') {
                        score -= 5;
                        showFloatingText('-5', false);
                    } else {
                        score += 2;
                        showFloatingText('+2', true);
                    }
                    scoreEl.textContent = score;

                    item.element.remove();
                    items.splice(i, 1);
                }
            }
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(timerInterval);
            clearInterval(itemSpawnInterval);

            gameArea.removeEventListener('touchmove', handleTouch);
            gameArea.removeEventListener('mousemove', handleMouse);
            window.removeEventListener('keydown', handleKeydown);

            items.forEach(item => item.element.remove());
            items = [];

            nextScreen(4);
        }
    </script>
</body>
</html>
